<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maten TV - Auto Player</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: Tahoma, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        #status { font-size: 18px; }
    </style>
</head>
<body>

    <div id="status">خەریکی ئامادەکردنی ڤیدیۆکەیە، تکایە چاوەڕێ بکە...</div>

    <script>
        async function startAutoPlay() {
            // وەرگرتنی ئایدی لە لینکەکەوە
            const urlParams = new URLSearchParams(window.location.search);
            const vid = urlParams.get('id');
            const statusText = document.getElementById('status');

            if(!vid) {
                statusText.innerText = "تکایە ئایدی ڤیدیۆکە لە لینکەکەدا دابنێ (نموونە: ?id=15635834281716)";
                return;
            }

            const targetUrl = encodeURIComponent(`https://ok.ru/videoembed/${vid}`);
            const proxyUrl = `https://api.allorigins.win/get?url=${targetUrl}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const html = data.contents;

                // شکاندنی کۆدەکە و دۆزینەوەی m3u8
                const match = html.match(/data-options=(?:'|")([^'"]+)(?:'|")/i);
                if(match && match[1]) {
                    let decoded = decodeURIComponent(match[1].replace(/&quot;/g, '"').replace(/&amp;/g, '&'));
                    let m3u8Match = decoded.match(/(https:\/\/[^"'\s\\]+\.m3u8[^"'\s\\]*)/i);
                    
                    if(m3u8Match && m3u8Match[1]) {
                        let cleanLink = m3u8Match[1].replace(/\\u0026/g, '&');
                        statusText.innerText = "ڤیدیۆکە دۆزرایەوە! خەریکە پەخش دەبێت...";
                        
                        // ئەم دێڕە بە ئۆتۆماتیکی وێبسایتەکە ئاڕاستەی لینکی ڤیدیۆکە دەکات
                        window.location.href = cleanLink;
                    } else {
                        statusText.innerText = "کێشە هەیە: لینکی ڤیدیۆکە نەدۆزرایەوە!";
                    }
                } else {
                    statusText.innerText = "کێشە هەیە: کۆدی ڤیدیۆکە نەدۆزرایەوە!";
                }
            } catch(e) {
                statusText.innerText = "هەڵەیەک ڕوویدا لە کاتی پەیوەندیکردندا.";
            }
        }

        // هەر کە لاپەڕەکە کرایەوە، ڕاستەوخۆ دەست بە گەڕان دەکات
        window.onload = startAutoPlay;
    </script>

</body>
</html>
